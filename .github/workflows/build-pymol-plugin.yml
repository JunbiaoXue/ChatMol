name: Build PyMOL Plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "pymol_plugin/chatmol_ai/**"
      - "pymol_plugin/v2/chatmol.py"
      - "scripts/build_plugin_zip.py"
      - ".github/workflows/build-pymol-plugin.yml"
  pull_request:
    branches: [main]
    paths:
      - "pymol_plugin/chatmol_ai/**"
      - "pymol_plugin/v2/chatmol.py"
      - "scripts/build_plugin_zip.py"
      - ".github/workflows/build-pymol-plugin.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python -m compileall -q pymol_plugin/chatmol_ai

      - name: Build installable ZIP
        run: python scripts/build_plugin_zip.py

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatmol-ai-pymol-plugin
          path: dist/chatmol-ai-v*.zip

      - name: Resolve plugin version
        if: github.event_name != 'pull_request'
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("pymol_plugin/chatmol_ai/version.py").read_text())
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "__version__":
                          print(ast.literal_eval(node.value))
                          raise SystemExit(0)
          raise SystemExit("Could not read ChatMol version")
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "ChatMol AI $TAG"
          fi
          gh release upload "$TAG" dist/chatmol-ai-v*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
